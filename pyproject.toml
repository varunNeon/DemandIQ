[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "demandiq"
version = "0.1.0"
description = "Probabilistic Demand Forecasting & Inventory Intelligence Platform"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "sqlalchemy>=2.0.0",
    "statsmodels>=0.14.0",
    "lightgbm>=4.5.0",
    "scikit-learn>=1.5.0",
    "python-dotenv>=1.0.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.13.0",
    "rich>=13.0.0",
    "fastapi>=0.115,<0.120",
    "uvicorn[standard]>=0.30,<0.35",
    "streamlit>=1.40,<2",
    "plotly>=5.20,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "httpx>=0.27,<0.29",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Scripts add src/ to sys.path before importing the package.
"scripts/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
