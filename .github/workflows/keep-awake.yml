name: Keep Streamlit app awake

# Visits the deployed app every 6 hours so Streamlit Community Cloud does not
# put it to sleep. Set the app URL once under
# Settings -> Secrets and variables -> Actions -> Variables -> STREAMLIT_APP_URL.

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours, at a quiet minute
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: read

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ vars.STREAMLIT_APP_URL != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install "playwright>=1.45,<2"
          python -m playwright install --with-deps chromium

      - name: Open the app
        env:
          STREAMLIT_APP_URL: ${{ vars.STREAMLIT_APP_URL }}
        run: python scripts/keep_awake.py
